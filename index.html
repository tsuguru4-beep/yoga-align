<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9C4A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="姿勢ヨガ">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon.svg">

<body><title>姿勢ヨガ処方ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 片手操作の縦一列。肩・腰評価アプリと同じ構成で、アクセントはテラコッタ */
:root{
  --bg:#F3EFEB; --surface:#FFFFFF; --surface-2:#EAE3DC; --line:#D6CCC2;
  --ink:#231A15; --ink-2:#5E5249;
  --accent:#9C4A2B; --accent-ink:#FFFFFF; --accent-soft:#F4DFD3;
  --tight:#2F5F86; --tight-soft:#DCE8F2;
  --warn:#8A5A00; --warn-soft:#F8E9C6; --bad:#A3271B; --bad-soft:#F6D9D4;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120F; --surface:#211A16; --surface-2:#2D241F; --line:#41352D;
  --ink:#EFE7E1; --ink-2:#B3A69C;
  --accent:#F0A47E; --accent-ink:#2A1208; --accent-soft:#3D2519;
  --tight:#8DBDE6; --tight-soft:#1C2C3B;
  --warn:#E3B04B; --warn-soft:#3A2C0E; --bad:#F08A72; --bad-soft:#3E1A14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17120F; --surface:#211A16; --surface-2:#2D241F; --line:#41352D;
  --ink:#EFE7E1; --ink-2:#B3A69C;
  --accent:#F0A47E; --accent-ink:#2A1208; --accent-soft:#3D2519;
  --tight:#8DBDE6; --tight-soft:#1C2C3B;
  --warn:#E3B04B; --warn-soft:#3A2C0E; --bad:#F08A72; --bad-soft:#3E1A14; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2,h3{margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto}
.app{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app small{font-weight:500;color:var(--ink-2);margin-left:6px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:8px}
.steps button{border:0;background:none;padding:6px 0 8px;font-size:12px;color:var(--ink-2);border-top:3px solid var(--line)}
.steps button.done{border-top-color:var(--accent-soft)}
.steps button[aria-current="step"]{border-top-color:var(--accent);color:var(--ink);font-weight:700}

/* main */
.wrap{max-width:560px;margin:0 auto;padding:14px 0 120px;display:flex;flex-direction:column;gap:12px}
.ttl{font-size:19px;font-weight:700;margin:2px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card > h3{font-size:15px}
.sub{font-size:12.5px;color:var(--ink-2);margin:0}
.sec-title{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);margin:6px 2px -4px}

/* segmented & chips */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg.compact button{min-height:40px;font-size:14px;padding:6px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;text-align:left}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:500}
.chips button[aria-pressed="true"]::before{content:"✓ ";color:var(--accent);font-weight:700}
input[type=text],input[type=date],textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
textarea{min-height:260px;resize:vertical;font-size:13.5px;line-height:1.6;background:var(--surface-2);border:0}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}

/* buttons */
.btn{min-height:48px;padding:0 16px;border-radius:12px;font-weight:700;border:1px solid var(--line);background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .btn{flex:1 1 auto}
.link{background:none;border:0;color:var(--accent);font-size:14px;padding:6px 0;min-height:36px;text-decoration:underline;text-underline-offset:3px}

/* notices */
.note{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.note.warn{background:var(--warn-soft);border:1px solid var(--warn)}
.note.info{background:var(--accent-soft);border:1px solid var(--accent)}
.note p{margin:0}
details.hint summary{font-size:13px;color:var(--accent);cursor:pointer;padding:4px 0;list-style:none}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::before{content:"▸ "}
details.hint[open] summary::before{content:"▾ "}
details.hint p,details.hint ol{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
details.hint ol{padding-left:1.3em}

/* findings */
.fd{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.fd:first-of-type{border-top:0;padding-top:0}
.fd-head{display:flex;align-items:center;gap:8px;font-size:15px}
.miss{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.side-row{display:flex;align-items:center;gap:10px}
.side-row > span{font-size:13px;color:var(--ink-2);flex:none;min-width:5.5em}
.side-row .seg{flex:1}
.fd.on .fd-head b{color:var(--accent)}
.plumb{display:flex;gap:12px;align-items:center}
.plumb svg{width:84px;flex:none}
.plumb ul{margin:0;padding-left:1.1em;font-size:13px;color:var(--ink-2)}

/* judgement */
.type{border-left:4px solid var(--accent);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:2px}
.type b{font-size:15px}
.type span{font-size:13px;color:var(--ink-2)}
.ms{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.ms:first-of-type{border-top:0;padding-top:0}
.ms-head{display:flex;align-items:baseline;gap:8px}
.ms-head b{font-size:15px}
.ms-head .sd{font-size:12px;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.ms.ok .ms-head b{text-decoration:line-through;color:var(--ink-2)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.t i{background:var(--tight)}
.src{font-size:12.5px;color:var(--ink-2)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--tight-soft);color:var(--tight);border:1px solid var(--tight)}

/* asana cards */
.as{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.as:first-of-type{border-top:0;padding-top:0}
.as-row{display:flex;gap:12px;align-items:flex-start}
.as-row .pose{width:96px;flex:none;background:var(--surface-2);border-radius:10px}
.as.on .as-row .pose{background:var(--accent-soft)}
.as-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.as-txt b{font-size:16px}
.as-txt small{font-size:12.5px;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11.5px;padding:2px 7px;border-radius:6px}
.tg-s{background:var(--accent-soft);color:var(--accent)}
.tg-t{background:var(--tight-soft);color:var(--tight)}
.tg-c{background:var(--warn-soft);color:var(--warn);font-weight:700}
.tg-x{background:var(--bad-soft);color:var(--bad);font-weight:700}
.side-note{font-size:13px;color:var(--accent);font-weight:500}
.prog-list{margin:0;padding-left:1.4em;font-size:14px;display:flex;flex-direction:column;gap:2px}
.prog-list small{color:var(--ink-2)}

/* pose figure */
.pose{display:block;width:100%;height:auto}
.pose .lb{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.pose .far{stroke:var(--ink-2);opacity:.5}
.pose .hd{fill:var(--ink)}
.pose .fl{stroke:var(--line);stroke-width:1.6}
.pose .pr{fill:var(--tight-soft);stroke:var(--tight);stroke-width:1}

/* patient view */
.pv-head{display:flex;flex-direction:column;gap:2px;padding:4px 2px}
.pv-head h2{font-size:22px}
.pv-head p{margin:0;color:var(--ink-2);font-size:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;break-inside:avoid}
.pc-top{display:flex;align-items:baseline;gap:10px}
.pc-n{font-family:var(--f-num);font-size:15px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.pc h3{font-size:20px}
.pc .sa{font-size:13px;color:var(--ink-2);margin:-6px 0 0 40px}
.pc .pose{background:var(--surface-2);border-radius:12px;max-width:360px;margin:0 auto}
.pc .aim{margin:0;font-size:15px}
.pc ul{margin:0;padding-left:1.2em;font-size:17px;line-height:1.7}
.pc .dose{margin:0;font-size:17px;font-weight:700;color:var(--accent)}
.pc .pmod{margin:0;font-size:15px;padding:8px 12px;border-radius:10px;background:var(--warn-soft)}
.pv-rules{font-size:16px}

/* bottom nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.nav-in .primary{flex:1}
.nav-mid{font-size:12px;color:var(--ink-2);text-align:center;line-height:1.3;min-width:4.5em}
.flash{font-size:14px;font-weight:700;color:var(--accent)}

@media print{
  .top,.bottom,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .wrap{padding:0;max-width:none}
  .pc{border:1px solid #999}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="top-in" id="top"></div></header>
<main id="main"></main>
<nav class="bottom" aria-label="ステップ移動"><div class="nav-in" id="bottom"></div></nav>

<script>
"use strict";
const KEY = "yoga-align-draft-v1";

const STEPS = [
  {id:"info", label:"基本", title:"基本情報・禁忌の確認"},
  {id:"sag",  label:"側面", title:"矢状面（側方から）"},
  {id:"fro",  label:"前後", title:"前額面（前方・後方から）"},
  {id:"jud",  label:"判定", title:"姿勢タイプと筋の推定"},
  {id:"rx",   label:"処方", title:"アーサナの選択"},
  {id:"out",  label:"指導", title:"患者向け表示・記録"}
];

/* 筋。n=名称, pn=患者向けの呼び方, wt=弱化の確認テスト, tt=短縮の確認テスト */
const MUSCLES = {
  dnf:    {n:"深部頸部屈筋群", pn:"首の奥の筋肉", wt:"頭頸部屈曲テスト（CCFT）・背臥位で顎を引いた頭部挙上保持"},
  uptrap: {n:"上部僧帽筋", pn:"肩の上の筋肉", wt:"肩甲骨挙上・上方回旋の筋力", tt:"頸部側屈（対側）・回旋可動域"},
  levsc:  {n:"肩甲挙筋", pn:"首から肩甲骨の筋肉", tt:"頸部屈曲＋対側側屈・回旋で伸張感"},
  scm:    {n:"胸鎖乳突筋・斜角筋", pn:"首の前の筋肉", tt:"頸部伸展・対側側屈の可動域"},
  subocc: {n:"後頭下筋群", pn:"首の付け根の筋肉", tt:"上位頸椎屈曲（うなずき）の可動域"},
  midtrap:{n:"中部僧帽筋・菱形筋", pn:"肩甲骨の間の筋肉", wt:"腹臥位水平外転（T）MMT"},
  lowtrap:{n:"下部僧帽筋", pn:"肩甲骨を下げる筋肉", wt:"腹臥位Y挙上MMT"},
  serr:   {n:"前鋸筋", pn:"わきの下の筋肉", wt:"前鋸筋MMT・壁プッシュアップで翼状の出現"},
  rcuff:  {n:"肩外旋筋群（棘下筋・小円筋）", pn:"肩の後ろの筋肉", wt:"下垂位外旋MMT"},
  pmin:   {n:"小胸筋", pn:"胸の奥の筋肉", tt:"背臥位で肩峰–床距離"},
  pmaj:   {n:"大胸筋", pn:"胸の筋肉", tt:"背臥位で肩外転・水平外転の可動域"},
  lat:    {n:"広背筋", pn:"背中の横の筋肉", tt:"肩屈曲可動域（腰椎代償の有無）"},
  ercT:   {n:"胸部脊柱起立筋", pn:"背中の筋肉", wt:"腹臥位胸椎伸展の保持", tt:"胸椎屈曲の可動域"},
  ercL:   {n:"腰部脊柱起立筋", pn:"腰の筋肉", tt:"前屈時の腰椎の平坦化・屈曲可動域"},
  multL:  {n:"腰部多裂筋", pn:"腰の奥の筋肉", wt:"腹臥位体幹伸展保持（Sorensen）・多裂筋の触診"},
  ta:     {n:"腹横筋", pn:"お腹の奥の筋肉", wt:"ドローイン保持・腹臥位プレッシャーバイオフィードバック"},
  ra:     {n:"腹直筋", pn:"お腹の前の筋肉", wt:"上体起こしMMT", tt:"腹臥位プレスアップの可動域"},
  obl:    {n:"腹斜筋群", pn:"わき腹の筋肉", wt:"体幹回旋MMT・サイドブリッジ保持時間"},
  ql:     {n:"腰方形筋", pn:"腰の横の筋肉", wt:"サイドブリッジ保持時間", tt:"立位体幹側屈（対側）の可動域"},
  ilio:   {n:"腸腰筋", pn:"脚の付け根の奥の筋肉", wt:"座位股関節屈曲MMT（屈曲90°以上の保持）", tt:"Thomasテスト"},
  rf:     {n:"大腿直筋", pn:"太ももの前（付け根側）", tt:"修正Thomasテスト・Elyテスト"},
  gmax:   {n:"大殿筋", pn:"お尻の筋肉", wt:"腹臥位膝屈曲位の股関節伸展MMT・片脚ブリッジ"},
  gmed:   {n:"中殿筋", pn:"お尻の横の筋肉", wt:"側臥位股関節外転MMT・Trendelenburg徴候"},
  er:     {n:"深層外旋六筋", pn:"お尻の奥の筋肉", wt:"座位股関節外旋MMT"},
  tfl:    {n:"大腿筋膜張筋・腸脛靱帯", pn:"太ももの外側", tt:"Oberテスト"},
  add:    {n:"股関節内転筋群", pn:"太ももの内側", wt:"側臥位股関節内転MMT", tt:"開排・股関節外転の可動域"},
  ham:    {n:"ハムストリングス", pn:"太ももの裏", wt:"腹臥位膝屈曲MMT", tt:"SLR・膝窩角"},
  quad:   {n:"大腿四頭筋（内側広筋を含む）", pn:"太ももの前", wt:"座位膝伸展MMT・extension lag・椅子立ち上がり"},
  tricep: {n:"下腿三頭筋", pn:"ふくらはぎ", wt:"片脚踵上げの回数", tt:"膝伸展位・屈曲位での足関節背屈可動域"},
  tp:     {n:"後脛骨筋", pn:"土踏まずを支える筋肉", wt:"内がえしMMT・片脚踵上げ時の踵の内反", tt:"外がえしの可動域"},
  per:    {n:"腓骨筋群", pn:"すねの外側の筋肉", wt:"外がえしMMT", tt:"内がえしの可動域"},
  intr:   {n:"足部内在筋", pn:"足の裏の筋肉", wt:"ショートフット保持・足趾把持"}
};

/* 姿勢所見。w=弱化が推定される筋, t=短縮が推定される筋 [筋, 重み1-3, 側 s=選んだ側 o=反対側]
   side: "lat"=右か左, "bi"=両側/右/左。sl=側ボタンの見出し。ex=同時に選べない所見 */
const GROUPS = {sag:["頭頸部","肩甲帯・胸椎","腰椎・骨盤","膝"], fro:["頭頸部","肩甲帯・胸椎","体幹・骨盤","膝・股関節","足部"]};
const FINDINGS = [
  {id:"fhp", pl:"sag", g:"頭頸部", n:"頭部前方位", h:"耳垂が肩峰を通る垂線より前方にある。",
    w:[["dnf",3],["lowtrap",1]], t:[["subocc",2],["scm",2],["levsc",1]]},
  {id:"rsh", pl:"sag", g:"肩甲帯・胸椎", n:"巻き肩（肩甲骨前方突出）", h:"肩峰が垂線より前方にあり、肩甲骨が外転・前傾している。",
    w:[["midtrap",3],["lowtrap",2],["serr",1],["rcuff",1]], t:[["pmin",3],["pmaj",2]]},
  {id:"kyph", pl:"sag", g:"肩甲帯・胸椎", n:"胸椎後弯の増大（円背）", h:"胸椎の丸みが大きく、上体が前に丸まっている。", ex:"flatT",
    w:[["ercT",3],["midtrap",2],["lowtrap",2]], t:[["pmaj",2],["ra",1]]},
  {id:"flatT", pl:"sag", g:"肩甲帯・胸椎", n:"胸椎後弯の減少（平坦な背部）", h:"胸椎の丸みが少なく、背中が平らに見える。", ex:"kyph",
    w:[["serr",2]], t:[["ercT",2]]},
  {id:"lordInc", pl:"sag", g:"腰椎・骨盤", n:"腰椎前弯の増大", h:"腰の反りが大きく、腹部が前に出ている。", ex:"lordDec",
    w:[["ta",3],["ra",2],["obl",2],["gmax",1]], t:[["ercL",3],["ilio",2]]},
  {id:"lordDec", pl:"sag", g:"腰椎・骨盤", n:"腰椎前弯の減少（平坦な腰部）", h:"腰の反りが少なく、腰部が平らに見える。", ex:"lordInc",
    w:[["multL",3],["ilio",2]], t:[["ham",2],["ra",1]]},
  {id:"pelAnt", pl:"sag", g:"腰椎・骨盤", n:"骨盤前傾", h:"ASISがPSISより明らかに低い（目安：女性で2横指以上、男性で1横指以上）。", ex:"pelPost",

function load(){ try{ const t = localStorage.getItem(KEY); return t ? Object.assign(blank(), JSON.parse(t)) : null; }catch(e){ return null; } }

const $ = s => document.querySelector(s);
const esc = s => String(s==null ? "" : s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FBY = Object.fromEntries(FINDINGS.map(f=>[f.id,f]));
const ABY = Object.fromEntries(ASANAS.map(a=>[a.id,a]));

/* ---------- 推定 ---------- */
function activeFindings(){ const o = {}; FINDINGS.forEach(f=>{ const st = S.find[f.id]; if (st && st.sev) o[f.id] = st.sev; }); return o; }

function analyze(){
  const weak = {}, tight = {};
  const add = (map, m, v, side, fid) => {
    const o = map[m] || (map[m] = {m, sc:0, sides:{}, src:[]});
    o.sc += v;
    if (side) o.sides[side] = (o.sides[side]||0) + v;
    if (!o.src.includes(fid)) o.src.push(fid);
  };
  FINDINGS.forEach(f=>{
    const st = S.find[f.id]; if (!st || !st.sev) return;
    const side = f.side ? (st.side || null) : null;
    const res = rel => !side ? null : side==="B" ? "B" : (rel==="o" ? (side==="R"?"L":"R") : side);
    f.w.forEach(([m,v,rel])=>add(weak, m, v*st.sev, rel ? res(rel) : null, f.id));
    f.t.forEach(([m,v,rel])=>add(tight, m, v*st.sev, rel ? res(rel) : null, f.id));
  });
  Object.values(weak).forEach(o=>{
    o.raw = o.sc; o.c = S.conf[o.m] || null;
    if (o.c==="low") o.sc *= 1.5;
    if (o.c==="ok") o.sc = 0;
  });
  return {weak, tight};
}
function sideLabel(sides){
  const k = Object.keys(sides||{});
  if (!k.length) return "";
  if (k.includes("B") || (k.includes("R") && k.includes("L"))){
    if (!k.includes("B") && sides.R !== sides.L) return sides.R > sides.L ? "両側（右＞左）" : "両側（左＞右）";
    return "両側";
  }
  return SIDE_JA[k[0]];
}
function flagsOf(a){
  const ex = [], ca = [];
  SCREEN.forEach(sc=>{
    if (!S.screen[sc.id]) return;
    a.tags.forEach(t=>{
      if ((sc.ex||[]).includes(t)) ex.push({sc, t});
      else if ((sc.ca||[]).includes(t) && !ca.some(x=>x.t===t)) ca.push({sc, t});
    });
  });
  return {ex, ca};
}
function scoreAll(A){
  return ASANAS.map(a=>{
    const why = []; let sc = 0;
    Object.entries(a.s).forEach(([m,w])=>{ const o = A.weak[m]; if (o && o.sc>0){ const v = w*o.sc; sc += v; why.push({m, v, k:"s"}); } });
    a.t.forEach(m=>{ const o = A.tight[m]; if (o && o.sc>0){ const v = 0.8*o.sc; sc += v; why.push({m, v, k:"t"}); } });
    why.sort((x,y)=>y.v-x.v);
    /* 左右別のアーサナで、ねらう筋の弱化が片側に偏るときは重点側を示す */
    let side = null;
    if (a.uni){
      let r = 0, l = 0;
      why.forEach(w=>{ const o = (w.k==="s" ? A.weak : A.tight)[w.m]; const sd = o.sides||{}; r += (sd.R||0)*w.v; l += (sd.L||0)*w.v; });
      if (r > l*1.5 && r>0) side = "R"; else if (l > r*1.5 && l>0) side = "L";
    }
    return {a, sc, why, side, fl:flagsOf(a)};
  });
}
/* 自動選択：同じ筋を狙うアーサナばかりにならないよう、選ぶたびにその筋の価値を下げる */
function autoProg(){
  const A = analyze(), all = scoreAll(A);
  const cands = all.filter(c=>!c.fl.ex.length && c.sc>0 && c.a.id!=="tadasana");
  const picked = [], cov = {};
  for (let i=0; i<5; i++){
    let best = null, bv = 0;
    cands.forEach(c=>{
      if (picked.includes(c.a.id)) return;
      let v = 0; c.why.forEach(w=>{ v += w.v/(1+(cov[w.m]||0)*1.5); });
      v *= c.fl.ca.length ? 0.85 : 1;
      if (v > bv){ bv = v; best = c; }
    });
    if (!best || bv < 1) break;
    picked.push(best.a.id);
    best.why.forEach(w=>{ cov[w.m] = (cov[w.m]||0) + 1; });
  }
  if (Object.keys(activeFindings()).length && !flagsOf(ABY.tadasana).ex.length) picked.unshift("tadasana");
  return picked;
}
function sortedProg(){
  return S.prog.filter(id=>ABY[id]).sort((x,y)=>POS_ORDER.indexOf(ABY[x].pos)-POS_ORDER.indexOf(ABY[y].pos) || S.prog.indexOf(x)-S.prog.indexOf(y));
}

/* ---------- 図 ---------- */
function poseSVG(id){
  const p = POSES[id]; if (!p) return "";
  const pt = q => q[0]+" "+q[1];
  const shift = arr => arr.map(q=>[q[0]+1.6, q[1]]);
  const path = (pts, far) => `<path class="lb${far?" far":""}" d="M${pts.map(pt).join(" L")}"/>`;
  const a2 = p.a2 || shift(p.a1), l2 = p.l2 || shift(p.l1);
  const far = !p.f;
  let s = `<svg class="pose" viewBox="0 0 120 96" aria-hidden="true"><line class="fl" x1="4" y1="91.5" x2="116" y2="91.5"/>`;
  (p.pr||[]).forEach(r=>{ s += `<rect class="pr" x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="1.5"/>`; });
  s += path([p.p, ...l2], far) + path([p.n, ...a2], far);
  s += p.c ? `<path class="lb" d="M${pt(p.p)} Q${pt(p.c)} ${pt(p.n)} L${pt(p.h)}"/>` : path([p.p, p.n, p.h]);
  s += path([p.p, ...p.l1]) + path([p.n, ...p.a1]);
  s += `<circle class="hd" cx="${p.h[0]}" cy="${p.h[1]}" r="5.6"/></svg>`;
  return s;
}
function plumbSVG(){
  return `<svg viewBox="0 0 60 120" aria-hidden="true">
    <line x1="34" y1="4" x2="34" y2="116" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="31" cy="14" r="8" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
    <path d="M31 22 Q27 44 31 60 Q34 64 33 64 L34 86 L35 108 L44 110" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    ${[[34,15],[34,28],[34,62],[34.5,86],[35,107]].map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.6" fill="var(--accent)"/>`).join("")}
  </svg>`;
}

  let h = `<div class="fd${sev?" on":""}">

    <p class="sub">${f.h}</p>
    <div class="seg compact">${SEV.map((l,i)=>`<button data-act="sev" data-id="${f.id}" data-v="${i}" aria-pressed="${sev===i}">${l}</button>`).join("")}</div>`;
  if (f.side && sev){
    const opts = f.side==="bi" ? ["B","R","L"] : ["R","L"];
    h += `<div class="side-row"><span>${f.sl}</span><div class="seg compact">${opts.map(o=>`<button data-act="side" data-id="${f.id}" data-v="${o}" aria-pressed="${st.side===o}">${SIDE_JA[o]}</button>`).join("")}</div></div>`;

}

    : `<div class="card"><p class="sub" style="margin:0"><b>前方：</b>頭部の傾き・肩の高さ・ASISの高さ・膝蓋骨の向き・膝の位置・アーチ<br><b>後方：</b>肩甲骨の位置・棘突起の並び・腸骨稜の高さ・踵骨の傾き</p></div>`;

function vJudge(){
  const F = activeFindings(), A = analyze();
  if (!Object.keys(F).length) return `<div class="ttl">${STEPS[3].title}</div><div class="note warn"><p>まだ所見が選ばれていません。「側面」「前後」で所見を選んでください。</p></div>`;
  const types = TYPES.filter(t=>t.when(F));
  const weak = Object.values(A.weak).sort((x,y)=>y.raw-x.raw);
  const tight = Object.values(A.tight).sort((x,y)=>y.sc-x.sc);
  const maxW = Math.max(...weak.map(o=>o.raw), 1), maxT = Math.max(...tight.map(o=>o.sc), 1);
  const src = o => o.src.map(id=>FBY[id].n).join("・");
  return `<div class="ttl">${STEPS[3].title}</div>
  <div class="card"><h3>姿勢タイプ</h3>
    ${types.length ? types.map(t=>`<div class="type"><b>${t.n}</b><span>${t.d}</span></div>`).join("") : `<p class="sub">典型的な姿勢タイプには当てはまりません。部位別の所見から推定します。</p>`}
  </div>
  <div class="card"><h3>筋力低下の推定（強化の対象）</h3>
    <p class="sub">MMTなどで確認し「低下あり」「問題なし」を入れると処方に反映します。「問題なし」の筋は処方の対象から外れます。</p>
    ${weak.map(o=>{ const M = MUSCLES[o.m], sd = sideLabel(o.sides);
      return `<div class="ms${o.c==="ok"?" ok":""}">

        <div class="bar"><i style="width:${Math.round(o.raw/maxW*100)}%"></i></div>
        <div class="src">根拠：${src(o)}</div>
        ${M.wt?`<div class="src">確認：${M.wt}</div>`:""}
        <div class="seg compact">${[["","推定のまま"],["low","低下あり"],["ok","問題なし"]].map(([v,l])=>`<button data-act="conf" data-m="${o.m}" data-v="${v}" aria-pressed="${(o.c||"")===v}">${l}</button>`).join("")}</div>
      </div>`; }).join("")}
  </div>
  <div class="card"><h3>短縮の推定（伸張の対象）</h3>
    ${tight.map(o=>{ const M = MUSCLES[o.m], sd = sideLabel(o.sides);
      return `<div class="ms"><div class="ms-head"><b>${M.n}</b>${sd?`<span class="sd">${sd}</span>`:""}</div>
        <div class="bar t"><i style="width:${Math.round(o.sc/maxT*100)}%"></i></div>
        <div class="src">根拠：${src(o)}${M.tt?`／確認：${M.tt}`:""}</div></div>`; }).join("")}
  </div>`;
}

function asanaCard(c, A){
  const a = c.a, on = S.prog.includes(a.id), ex = c.fl.ex.length > 0;
  const tg = [];
  c.why.slice(0,4).forEach(w=>tg.push(`<span class="${w.k==="s"?"tg-s":"tg-t"}">${w.k==="s"?"強化":"伸張"} ${MUSCLES[w.m].n}</span>`));
  c.fl.ca.forEach(x=>tg.push(`<span class="tg-c">注意 ${TAGS[x.t].n}</span>`));
  c.fl.ex.forEach(x=>tg.push(`<span class="tg-x">除外 ${x.sc.n}</span>`));
  const mods = [a.mod, ...c.fl.ca.map(x=>TAGS[x.t].mod)].filter(Boolean);
  return `<div class="as${on?" on":""}">
    <div class="as-row">${poseSVG(a.id)}
      <div class="as-txt"><b>${a.ja}</b><small>${a.sa}・${a.pos}・難易度${"●".repeat(a.lv)}${"○".repeat(3-a.lv)}</small>
        ${tg.length?`<div class="tags">${tg.join("")}</div>`:""}
        ${c.side?`<div class="side-note">${SIDE_JA[c.side]}側を重点的に</div>`:""}
      </div></div>
    ${ex ? "" : `<div class="row"><button class="btn small${on?"":" primary"}" data-act="tog" data-id="${a.id}">${on?"処方から外す":"処方に追加"}</button></div>`}
    <details class="hint"><summary>手順・観察点・修正版</summary>
      <ol>${a.how.map(x=>`<li>${x}</li>`).join("")}</ol>
      <p><b>観察：</b>${a.pt}</p>
      <p><b>修正版：</b>${mods.join("／")}</p>
      <p><b>量の目安：</b>${a.dose}</p>
    </details>
  </div>`;
}
function vRx(){

function recordText(){
  const F = activeFindings(), A = analyze(), all = scoreAll(A), by = Object.fromEntries(all.map(c=>[c.a.id,c]));
  const L = [];
  L.push(`【ヨガ・アライメント評価】${S.info.date||""}${S.info.id?"　ID："+S.info.id:""}`);
  const scr = SCREEN.filter(sc=>S.screen[sc.id]).map(sc=>sc.n);
  L.push(`禁忌・注意：${scr.length?scr.join("、"):"なし"}`);
  ["sag","fro"].forEach(pl=>{
    const fs = FINDINGS.filter(f=>f.pl===pl && F[f.id]).map(f=>{
      const st = S.find[f.id]; const sd = f.side && st.side ? `${f.sl}：${SIDE_JA[st.side]}・` : "";
      return `${f.n}（${sd}${SEV[st.sev]}）`;
    });
    L.push(`${pl==="sag"?"矢状面":"前額面"}：${fs.length?fs.join("、"):"特記なし"}`);
  });
  const types = TYPES.filter(t=>t.when(F)).map(t=>t.n);
  if (types.length) L.push(`姿勢タイプ（推定）：${types.join("、")}`);
  const weak = Object.values(A.weak).sort((x,y)=>y.raw-x.raw);
  if (weak.length) L.push(`筋力低下の推定：${weak.map(o=>MUSCLES[o.m].n + (sideLabel(o.sides)?`（${sideLabel(o.sides)}）`:"") + (o.c==="low"?"［低下確認］":o.c==="ok"?"［問題なし］":"")).join("、")}`);
  const tight = Object.values(A.tight).sort((x,y)=>y.sc-x.sc);
  if (tight.length) L.push(`短縮の推定：${tight.map(o=>MUSCLES[o.m].n + (sideLabel(o.sides)?`（${sideLabel(o.sides)}）`:"")).join("、")}`);
  const prog = sortedProg();
  L.push(`処方アーサナ：${prog.length?"":"なし"}`);
  prog.forEach((id,i)=>{
    const c = by[id], a = c.a;
    const tg = c.why.filter(w=>w.k==="s").slice(0,3).map(w=>MUSCLES[w.m].n);
    const mods = c.fl.ca.map(x=>TAGS[x.t].mod);
    L.push(`　${i+1}. ${a.ja}（${a.sa}）${a.dose}${c.side?`、${SIDE_JA[c.side]}側重点`:""}${tg.length?`　目的：${tg.join("・")}の強化`:""}${mods.length?`　修正：${mods.join("／")}`:""}`);
  });
  L.push("※立位アライメントからの推定。筋力・筋長は検査で確認し、反応をみて処方を調整する。");
  return L.join("\n");
}
function vOut(){
  const A = analyze(), all = scoreAll(A), by = Object.fromEntries(all.map(c=>[c.a.id,c]));
  const prog = sortedProg();
  const tabs = `<div class="seg noprint">${[["pt","患者に見せる"],["rec","記録"]].map(([v,l])=>`<button data-act="view" data-v="${v}" aria-pressed="${S.view===v}">${l}</button>`).join("")}</div>`;
  if (S.view==="rec"){
    return `<div class="ttl">${STEPS[5].title}</div>${tabs}
    <div class="card"><textarea id="rec" readonly>${esc(recordText())}</textarea>
    <div class="row"><button class="btn primary" data-act="copy">記録をコピー</button></div>${UI.flash?`<div class="flash">${UI.flash}</div>`:""}</div>`;
  }
  if (!prog.length) return `<div class="ttl">${STEPS[5].title}</div>${tabs}<div class="note warn"><p>処方がまだありません。「処方」でアーサナを選んでください。</p></div>`;
  return `<div class="ttl noprint">${STEPS[5].title}</div>${tabs}
  <div class="pv-head"><h2>あなたの姿勢づくりヨガ</h2><p>${esc(S.info.date||"")}</p></div>
  <div class="note info pv-rules"><p>・痛みやしびれが出たら、すぐにやめましょう<br>・呼吸は止めず、ゆっくり続けます<br>・反動をつけず、できる範囲で行いましょう</p></div>
  ${prog.map((id,i)=>patientCard(by[id], i)).join("")}
  <div class="row noprint"><button class="btn" data-act="print">印刷する</button></div>`;
}

const VIEWS = {info:vInfo, sag:()=>vPlane("sag"), fro:()=>vPlane("fro"), jud:vJudge, rx:vRx, out:vOut};
function render(){
  if (S.auto) S.prog = autoProg();
  $("#top").innerHTML = renderTop();
  $("#main").innerHTML = `<div class="wrap">${VIEWS[STEPS[S.step].id]()}</div>`;
  $("#bottom").innerHTML = renderBottom();
}
function goStep(n){
  S.step = Math.max(0, Math.min(STEPS.length-1, n));
  UI.flash = ""; UI.confirmClear = false;
  save(); render(); window.scrollTo(0,0);
}
function setPath(p, v){ const k = p.split("."); let o = S; while (k.length>1) o = o[k.shift()]; o[k[0]] = v; }

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act){
    case "go": return goStep(Number(d.n));
    case "scr": S.screen[d.id] = !S.screen[d.id]; break;
    case "sev": {
      const f = FBY[d.id], v = Number(d.v);
      const st = S.find[d.id] || (S.find[d.id] = {});
      st.sev = v;
      if (v && f.side==="bi" && !st.side) st.side = "B";
      if (v && f.ex && S.find[f.ex]) S.find[f.ex].sev = 0;
      break;
    }
    case "side": S.find[d.id].side = d.v; break;
    case "conf": if (d.v) S.conf[d.m] = d.v; else delete S.conf[d.m]; break;
    case "tog": {
      S.auto = false;
      S.prog = S.prog.includes(d.id) ? S.prog.filter(x=>x!==d.id) : [...S.prog, d.id];
      break;
    }
    case "reauto": S.auto = true; S.prog = autoProg(); break;
    case "clearprog": S.auto = false; S.prog = []; break;
    case "view": S.view = d.v; UI.flash = ""; break;
    case "copy": {
      const t = recordText();
      const done = ()=>{ UI.flash = "コピーしました"; render(); };
      const fallback = ()=>{ const ta = $("#rec"); ta.removeAttribute("readonly"); ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.setAttribute("readonly",""); done(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
      return;
    }
    case "print": window.print(); return;
    case "sample": S = sample(); return goStep(1);
    case "newpt": if (S.sample){ S = blank(); return goStep(0); } UI.confirmClear = true; render(); return;
    case "cancelclear": UI.confirmClear = false; render(); return;
    case "clear": S = blank(); return goStep(0);
  }
  save(); render();
});
document.addEventListener("input", e=>{
  const t = e.target;
  if (t.dataset.text){ setPath(t.dataset.text, t.value); save(); if (t.dataset.text==="info.id") $("#top .app small").textContent = t.value; }
});

S = load() || blank();
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
